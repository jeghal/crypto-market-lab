<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Binance Intelligence Pipeline</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    function openBinance() {
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) {
        window.location.href = "binance://";
        setTimeout(() => {
          window.location.href = "https://www.binance.com/ar/trade/BTC_USDT";
        }, 500);
      } else {
        window.open("https://www.binance.com/ar/trade/BTC_USDT", "_blank");
      }
    }
  </script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 class="page-title">Binance Intelligence Pipeline</h1>

      <div class="config-grid">
        <div class="config-card">
          <div class="config-header">
            <strong>العملات المستهدفة</strong>
            <span class="badge" id="symbolCount">0 عملات</span>
          </div>
          <div class="search-container">
            <div class="search-box">
              <span class="search-icon">🔍</span>
              <input type="text" id="symbolSearch" placeholder="ابحث عن عملة... (مثلاً: BNB)">
              <div id="searchResults" class="search-results"></div>
            </div>
            <div id="selectedTags" class="tags-container">
              <!-- العملات المختارة تظهر هنا كـ tags -->
            </div>
          </div>
          <!-- حقل مخفي للحفاظ على التوافق مع الكود الحالي -->
          <input type="hidden" id="symbolsInput" value="BTCUSDT, ETHUSDT, SOLUSDT">
        </div>
      </div>

      <div class="btn-row btn-row-copy">
        <button id="copyPromptBtn" class="secondary" type="button">نسخ البرومبت الرئيسي</button>
        <button id="copyPrompt2Btn" class="secondary" type="button">نسخ البرومبت الاحتياطي</button>
        <button id="copyFastPromptBtn" class="secondary" type="button">نسخ البرومبت السريع</button>
        <button id="copyOtocoBtn" class="secondary" type="button">نسخ برومبت OTOCO</button>
      </div>

      <div class="btn-row btn-row-actions">
        <button id="buildBtn" class="primary-action">إنشاء الحزمة</button>
        <button id="clearBtn" class="secondary" type="button">مسح السجل</button>
        <button type="button" class="binance-btn" onclick="openBinance()">فتح منصة Binance</button>
      </div>

      <div class="note-box">
        <div class="note-title">ملاحظة سريعة</div>
        <div class="note-text">
          الخيار الافتراضي هو <strong>البرومبت الرئيسي</strong> (Master Spot). 
          يمكن استخدام <strong>الاحتياطي</strong> (Strict Backup) كمرجع أكثر صرامة عند الحاجة، 
          أو <strong>السريع</strong> (Fast Scan) للمراجعة السريعة.
        </div>
      </div>

      <div id="progressWrap" class="progress-wrap">
        <div class="progress-text">
          <span>جاري معالجة البيانات...</span>
          <span id="progressCount">0/0</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressBarFill" class="progress-bar-fill"></div>
        </div>
      </div>

      <div class="status-box">
        <div class="status-title">الحالة</div>
        <div id="statusLog">جاهز.</div>
      </div>

      <div id="summary" class="summary"></div>
    </div>
  </div>

  <script src="assets/js/vendor/jszip.min.js"></script>
  <script src="assets/js/market-core.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/transforms.js"></script>
  <script src="assets/js/collectors.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
