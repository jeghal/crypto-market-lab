<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Binance Intelligence Pipeline</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    function openBinance() {
      const symInput = document.getElementById("symbolsInput");
      // Binance URLs typically use SYMBOL_USDT (e.g., BTC_USDT)
      const rawSym = (symInput && symInput.value) ? symInput.value : "BTCUSDT";
      const formattedSym = rawSym.includes("_") ? rawSym : rawSym.replace("USDT", "_USDT");
      const url = `https://www.binance.com/ar/trade/${formattedSym}`;
      
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isMobile) {
        // Try to open the app, fallback to web
        window.location.href = "binance://";
        setTimeout(() => {
          window.location.href = url;
        }, 500);
      } else {
        window.open(url, "_blank");
      }
    }
  </script>
</head>
<body>
  <div class="wrap" style="padding: 0;">
    <div class="card" style="border: none; box-shadow: none; background: transparent; padding: 10px;">

      <!-- حقل مخفي للحفاظ على التوافق مع منطق البرمجة -->
      <input type="hidden" id="symbolsInput" value="">

      <div class="btn-row btn-row-copy">
        <button id="copyPromptBtn" class="secondary" type="button">نسخ البرومبت الرئيسي</button>
        <button id="copyPrompt2Btn" class="secondary" type="button">نسخ البرومبت الاحتياطي</button>
        <button id="copyFastPromptBtn" class="secondary" type="button">نسخ البرومبت السريع</button>
        <button id="copyOtocoBtn" class="secondary" type="button">نسخ برومبت OTOCO</button>
      </div>

      <div class="btn-row btn-row-actions">
        <button id="buildBtn" class="primary-action">إنشاء الحزمة</button>
        <button id="clearBtn" class="secondary" type="button">مسح السجل</button>
        <button type="button" class="binance-btn" onclick="openBinance()">فتح منصة Binance</button>
      </div>

      <div class="note-box">
        <div class="note-title">ملاحظة سريعة</div>
        <div class="note-text">
          الخيار الافتراضي هو <strong>البرومبت الرئيسي</strong> (Master Spot). 
          يمكن استخدام <strong>الاحتياطي</strong> (Strict Backup) كمرجع أكثر صرامة عند الحاجة، 
          أو <strong>السريع</strong> (Fast Scan) للمراجعة السريعة.
        </div>
      </div>

      <div id="progressWrap" class="progress-wrap">
        <div class="progress-text">
          <span>جاري معالجة البيانات...</span>
          <span id="progressCount">0/0</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressBarFill" class="progress-bar-fill"></div>
        </div>
      </div>

      <div class="status-box">
        <div class="status-title">الحالة</div>
        <div id="statusLog">جاهز.</div>
      </div>

      <div id="summary" class="summary"></div>
    </div>
  </div>

  <script src="assets/js/vendor/jszip.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/transforms.js"></script>
  <script src="assets/js/collectors.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
